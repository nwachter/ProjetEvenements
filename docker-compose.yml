# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose


services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    #image: php:8.2-apache 
    container_name: php-app
    ports: 
      - 8080:80
    env_file: .env
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/ProjetEvenements
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html/ProjetEvenements # Mount PHP code
      - ./logs:/var/log/apache2  # Optional: Apache logs


  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: mysql:8.0
    restart: always
    user: "1000:1000"  #
    secrets:
     # - db-password
      - db-root-password
    volumes:
      - ./db/db-data:/var/lib/mysql:Z # MySQL stores data here, testerror : add :Z to fix permission issues
      - ./db/mysql-init-scripts:/docker-entrypoint-initdb.d
    env_file: .env.db
    environment:
      #- MYSQL_PASSWORD_FILE=/run/secrets/db-password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-root-password  
    expose:
      - 3306  
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: 

secrets:
  db-root-password:
    file: ./db/root_password.txt